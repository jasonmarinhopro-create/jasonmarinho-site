name: Process actualités queue

# Publie les actualités déposées par la routine de veille, puis réécrit
# data/actualites-publiees.md depuis la base (scripts/actualites-historique.mjs).
# Chaque matin à 6 h 40 UTC, avant la routine (7 h), l'historique est aussi
# réécrit : il contient les actualités ajoutées depuis l'admin et les masquées
# (23/10/2026 : une actu PLF 2027 déjà en base n'y figurait pas, la routine l'a
# reproposée trois jours de suite et l'API l'a refusée comme doublon).

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'data/actualites-queue/**'
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les actualités et vider la queue
        run: |
          FILES=$(find data/actualites-queue -name "*.json" 2>/dev/null | sort)
          if [ -z "$FILES" ]; then
            echo "Aucun fichier à traiter."
            exit 0
          fi
          TOTAL=0
          for FILE in $FILES; do
            echo "Traitement de $FILE..."
            RESPONSE=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
              -X POST https://app.jasonmarinho.com/api/actualites/insert \
              -H "Content-Type: application/json" \
              -H "x-insert-token: ${{ secrets.ACTUALITES_INSERT_SECRET }}" \
              --data-binary @"$FILE")
            echo "Status HTTP : $RESPONSE"
            cat /tmp/api_response.json; echo
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "207" ]; then
              N=$(jq -r '.inserted // 0' /tmp/api_response.json)
              TOTAL=$((TOTAL + N))
              # Doublons et erreurs en alerte visible (avant : seulement dans le journal)
              jq -r '.results[] | select(.status=="duplicate") | "::warning title=Actualité refusée (doublon)::\(.title)" + (if .similar_to then " — déjà publié : \(.similar_to)" else " — titre déjà en base" end)' /tmp/api_response.json || true
              jq -r '.results[] | select(.status=="error") | "::error title=Actualité refusée (erreur)::\(.title) — \(.error)"' /tmp/api_response.json || true
              rm "$FILE"
            else
              echo "::error title=Publication impossible::$FILE rejeté (HTTP $RESPONSE)"
              exit 1
            fi
          done
          echo "::notice title=Actualités publiées::$TOTAL nouvelle(s) actualité(s)"

      - name: Réécrire l'historique depuis la base
        env:
          ACTUALITES_INSERT_SECRET: ${{ secrets.ACTUALITES_INSERT_SECRET }}
        run: |
          node scripts/actualites-historique.mjs
          # Alerte si rien n'a été publié depuis 3 jours (dates des 3 derniers jours absentes de l'historique)
          RECENT=0
          for d in 0 1 2; do day=$(date -u -d "-$d day" +%F); grep -q "^- $day · " data/actualites-publiees.md && RECENT=1; done
          if [ "$RECENT" = "0" ]; then echo "::warning title=Veille actualités::Aucune actualité publiée depuis 3 jours"; fi

      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actualites-queue/ data/actualites-publiees.md
          if git diff --staged --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -m "chore: actualités publiées et historique à jour"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
