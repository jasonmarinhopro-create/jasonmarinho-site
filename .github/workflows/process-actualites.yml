name: Process actualités queue

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'data/actualites-queue/**'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les actualités et vider la queue
        run: |
          FILES=$(find data/actualites-queue -name "*.json" 2>/dev/null | sort)

          if [ -z "$FILES" ]; then
            echo "Aucun fichier à traiter."
            exit 0
          fi

          for FILE in $FILES; do
            echo "Traitement de $FILE..."
            PAYLOAD=$(cat "$FILE")
            RESPONSE=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
              -X POST https://app.jasonmarinho.com/api/actualites/insert \
              -H "Content-Type: application/json" \
              -H "x-insert-token: ${{ secrets.ACTUALITES_INSERT_SECRET }}" \
              -d "$PAYLOAD")
            echo "Status HTTP : $RESPONSE"
            cat /tmp/api_response.json
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "207" ]; then
              echo "OK : $FILE publié."
              # Doublons refusés (même sujet reformulé) : visibles dans les logs.
              jq -r '.results[] | select(.status=="duplicate") | "DOUBLON ignoré : \(.title)" + (if .similar_to then " (déjà publié : \(.similar_to))" else "" end)' /tmp/api_response.json || true
              # Historique lu par la routine de veille avant d'écrire
              # (évite qu'elle republie chaque jour le même sujet).
              jq -r --slurpfile p "$FILE" --arg d "$(date -u +%F)" '
                .results[] | select(.status=="inserted") | .title as $t
                | ($p[0] | if type=="array" then . else [.] end | map(select(.title==$t)) | .[0]) as $it
                | "- \($d) · \($it.category) · \($t)" + (if $it.source_url then " (\($it.source_url))" else "" end)
              ' /tmp/api_response.json >> data/actualites-publiees.md || true
              rm "$FILE"
            else
              echo "ERREUR : $FILE rejeté (HTTP $RESPONSE)"
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actualites-queue/ data/actualites-publiees.md
          git diff --staged --quiet || git commit -m "chore: actualités publiées et queue vidée"
          git push
