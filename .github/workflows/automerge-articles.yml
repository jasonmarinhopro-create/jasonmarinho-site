# Publication automatique des articles de blog.
#
# Pourquoi : la Routine « Rédaction article » (lun/mer/ven 7h) ne peut pas
# pousser sur main — son travail atterrit sur une branche claude/* (avec ou
# SANS pull request selon les cas : constaté le 17/07, la branche
# claude/laughing-einstein-max8hh a été poussée sans PR). Les articles
# s'empilaient et finissaient en conflit (articles-data.mjs, blog/index.html,
# rss.xml, sitemap.xml sont modifiés par CHAQUE publication).
#
# Deux déclencheurs, même garde-fou :
#  - push sur claude/**  → merge DIRECT de la branche dans main (cas Routine)
#  - pull_request        → merge de la PR (cas où une PR existe déjà)
# Dans les deux cas, on ne merge QUE si TOUS les fichiers modifiés sont des
# fichiers de publication (blog/, scripts/articles/, rss.xml, sitemap.xml,
# queue actualités, file, rapports et apprentissages des réseaux sociaux).
# Tout le reste est ignoré → revue humaine.
#
# NB : le merge est fait avec GITHUB_TOKEN — le déploiement Vercel part
# quand même (intégration Git Vercel, pas une Action).

name: Auto-merge articles blog

on:
  push:
    branches: ['claude/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Cas Routine : branche poussée sans PR → merge direct dans main ──────
  automerge-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que la branche ne touche que des fichiers d'article
        id: check
        run: |
          git fetch origin main --quiet
          FILES=$(git diff --name-only "origin/main...HEAD")
          echo "Fichiers modifiés vs main :"
          echo "$FILES"
          if [ -z "$FILES" ]; then
            echo "Rien à merger (branche au niveau de main)."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SAFE=true
          while IFS= read -r f; do
            case "$f" in
              blog/*|scripts/articles/*|rss.xml|sitemap.xml|data/actualites-queue/*|data/social-queue/*|data/social/rapports/*|data/social/APPRENTISSAGES.md) ;;
              *) SAFE=false; echo "→ Hors périmètre article : $f" ;;
            esac
          done <<< "$FILES"
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Merger la branche dans main
        if: steps.check.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if gh api "repos/${{ github.repository }}/merges" \
               -f base=main -f head="$BRANCH" \
               -f commit_message="Publication auto : $BRANCH (article de blog)"; then
            echo "Branche $BRANCH mergée dans main ✅"
            git push origin --delete "$BRANCH" || true
          else
            # Conflit (15/11/2026) : la page du blog, les catégories, rss.xml
            # et sitemap.xml sont régénérés à chaque publication et changent
            # aussi sur main (compteur d'articles, polices). On fusionne main
            # dans la branche ; si seuls ces fichiers générés sont en conflit,
            # on repart de ceux de main et on les régénère depuis
            # blog/articles-data.mjs fusionné (testé en local sur le conflit
            # du 14/11). Tout autre conflit reste à réparer à la main.
            # (L'ancienne PR de secours échouait : GitHub Actions n'a pas le
            # droit de créer de pull request sur ce dépôt.)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main --quiet
            if ! git merge origin/main --no-edit -m "Publication auto : main fusionnée dans $BRANCH"; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              echo "Fichiers en conflit :"; echo "$CONFLICTS"
              OK=true
              while IFS= read -r f; do
                case "$f" in
                  blog/index.html|blog/categorie/*|rss.xml|sitemap.xml) ;;
                  *) OK=false ;;
                esac
              done <<< "$CONFLICTS"
              if [ "$OK" != true ]; then
                git merge --abort
                echo "::error::Conflit hors fichiers générés : demande à Claude de réparer la branche $BRANCH"
                exit 1
              fi
              while IFS= read -r f; do git checkout --theirs -- "$f"; done <<< "$CONFLICTS"
              node scripts/rebuild-blog.mjs
              node scripts/inject-font-loading.mjs
              git add -A blog rss.xml sitemap.xml
              git commit --no-edit
            fi
            # On ne publie que des fichiers d'article, comme plus haut
            BAD=$(git diff --name-only origin/main HEAD | grep -Ev '^(blog/|scripts/articles/|rss\.xml$|sitemap\.xml$|data/actualites-queue/|data/social-queue/|data/social/rapports/|data/social/APPRENTISSAGES\.md$)' || true)
            if [ -n "$BAD" ]; then
              echo "::error::Hors périmètre après fusion : $BAD"
              exit 1
            fi
            git push origin "HEAD:main"
            echo "Conflit réparé, article publié sur main ✅"
            git push origin --delete "$BRANCH" || true
          fi

  # ── Cas PR : une pull request existe → merge de la PR ───────────────────
  automerge-pr:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/') && github.event.pull_request.user.login == 'jasonmarinhopro-create'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que la PR ne touche que des fichiers d'article
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "Fichiers modifiés :"
          echo "$FILES"
          SAFE=true
          while IFS= read -r f; do
            case "$f" in
              blog/*|scripts/articles/*|rss.xml|sitemap.xml|data/actualites-queue/*|data/social-queue/*|data/social/rapports/*|data/social/APPRENTISSAGES.md) ;;
              *) SAFE=false; echo "→ Hors périmètre article : $f" ;;
            esac
          done <<< "$FILES"
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Merger la PR
        if: steps.check.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr merge "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" \
               --squash --delete-branch; then
            echo "PR d'article mergée automatiquement ✅"
          else
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body "🤖 Auto-merge impossible (probablement un conflit avec un article publié entre-temps). Résous les conflits ou demande à Claude : « répare les conflits de la PR #${{ github.event.pull_request.number }} »."
            exit 1
          fi
