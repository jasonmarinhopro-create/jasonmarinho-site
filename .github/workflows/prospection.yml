name: Prospection

# Pilote la prospection sans ouvrir l'admin : appelle POST /api/outreach/ops
# de l'app (même secret que la publication des réseaux sociaux).
#   etat      : migrations, boîte d'envoi, contacts par étape, séquences
#   importer  : Google Maps + e-mail publié sur le site, ville par ville
#   activer   : installe et active les séquences des audiences choisies
#   envoyer   : lance un passage (réponses, inscriptions, envois dus)
# Les journaux sont publics (dépôt public) : la route ne renvoie que des
# nombres et des noms de séquences, jamais d'adresse e-mail.
on:
  # Push de .github/prospection-textes-trigger (branche claude/**) : corriger_textes
  push:
    branches: ['claude/**']
    paths: ['.github/prospection-textes-trigger']
  workflow_dispatch:
    inputs:
      operation:
        description: 'etat, essai, importer (Google Maps), importer_osm (OpenStreetMap), activer, envoyer, boite (relire 14 jours de réponses), corriger_textes'
        required: true
        default: etat
        type: choice
        options: [etat, essai, importer, importer_osm, activer, envoyer, boite, corriger_textes]
      audiences:
        description: 'Audiences (menage, photographe, séparées par des virgules)'
        required: false
        default: 'menage,photographe'
      villes:
        description: 'Villes à prospecter (import), séparées par des virgules'
        required: false
        default: 'Paris,Lyon,Marseille,Bordeaux,Nice,Toulouse,Montpellier,Nantes,Lille,Annecy,La Rochelle,Biarritz,Saint-Malo,Strasbourg,Rennes,Aix-en-Provence,Cannes,Arcachon,Avignon,Chamonix'
      plafond:
        description: 'Plafond d envois par jour (activer), 80 au plus'
        required: false
        default: '25'

concurrency:
  group: prospection
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: https://app.jasonmarinho.com
      SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
    steps:
      - name: Appel de l'app
        env:
          OP: ${{ inputs.operation || 'corriger_textes' }}
          AUDIENCES: ${{ inputs.audiences }}
          VILLES: ${{ inputs.villes }}
          PLAFOND: ${{ inputs.plafond }}
        run: |
          set -u
          call() {
            curl -sS --max-time 75 -X POST "$APP_URL/api/outreach/ops" \
              -H "authorization: Bearer $SECRET" -H 'content-type: application/json' -d "$1"
            echo
          }
          case "$OP" in
            etat)
              call '{"op":"status"}' | jq .
              echo "DNS de jasonmarinho.com (délivrabilité) :"
              echo "SPF   : $(dig +short TXT jasonmarinho.com | grep -i 'v=spf1' || echo 'ABSENT')"
              echo "DMARC : $(dig +short TXT _dmarc.jasonmarinho.com | grep -i 'v=dmarc1' || echo 'ABSENT')"
              for sel in hostingermail-a hostingermail-b hostingermail-c resend; do
                v=$(dig +short TXT "$sel._domainkey.jasonmarinho.com" | head -c 60); [ -n "$v" ] && echo "DKIM ($sel) : présent"
              done
              echo "MX    : $(dig +short MX jasonmarinho.com | tr '\n' ' ')"
              echo "Photo de signature : $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://jasonmarinho.com/signature-jason.jpg)" ;;
            essai)
              call '{"op":"test"}' | jq . ;;
            activer)
              AUD_JSON=$(echo "$AUDIENCES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";""))')
              call "$(jq -nc --argjson a "$AUD_JSON" --arg cap "$PLAFOND" '{op:"activate",audiences:$a,daily_cap:($cap|tonumber)}')" | jq . ;;
            envoyer)
              call '{"op":"run"}' | jq . ;;
            boite)
              r=$(call '{"op":"boite","jours":14}'); echo "$r" | jq .
              echo "::notice title=Boîte relue::$(echo "$r" | jq -c .)" ;;
            corriger_textes)
              r=$(call '{"op":"fix_texts"}'); echo "$r" | jq .
              echo "::notice title=Textes corrigés::$(echo "$r" | jq -c .)" ;;
            importer_osm)
              total=0
              IFS=',' read -ra AUDS <<< "$AUDIENCES"
              IFS=',' read -ra CITIES <<< "$VILLES"
              for a in "${AUDS[@]}"; do
                a=$(echo "$a" | sed 's/^ *//;s/ *$//')
                for v in "${CITIES[@]}"; do
                  v=$(echo "$v" | sed 's/^ *//;s/ *$//')
                  # Plusieurs passages par ville tant qu'il reste des sites à visiter (40 s par appel)
                  for pass in 1 2 3 4; do
                    body=$(jq -nc --arg a "$a" --arg v "$v" '{op:"import_osm",audience:$a,ville:$v}')
                    # OpenStreetMap (Overpass) est souvent saturé : 2 nouveaux essais espacés
                    for try in 1 2 3; do
                      res=$(call "$body")
                      echo "$res" | grep -q 'OpenStreetMap indisponible' || break
                      echo "$a | $v : OpenStreetMap saturé, nouvel essai dans $((try * 20)) s"
                      sleep $((try * 20))
                    done
                    echo "$a | $v ($pass) : $(echo "$res" | jq -c '{resultats, avec_site, sites_visites, reste_a_visiter, emails_trouves, ajoutes, error}' 2>/dev/null || echo "$res" | head -c 200)"
                    n=$(echo "$res" | jq -r '.ajoutes // 0' 2>/dev/null || echo 0)
                    total=$((total + n))
                    left=$(echo "$res" | jq -r '.reste_a_visiter // 0' 2>/dev/null || echo 0)
                    [ "$left" -gt 0 ] || break
                  done
                  sleep 8
                done
              done
              echo "Total ajouté : $total contacts"
              call '{"op":"status"}' | jq '{contacts, envoyes_total}' ;;
            importer)
              total=0
              IFS=',' read -ra AUDS <<< "$AUDIENCES"
              IFS=',' read -ra CITIES <<< "$VILLES"
              for a in "${AUDS[@]}"; do
                a=$(echo "$a" | sed 's/^ *//;s/ *$//')
                if [ "$a" = "menage" ]; then QUERIES=("ménage location saisonnière" "ménage airbnb"); else QUERIES=("photographe immobilier" "photographe location saisonnière"); fi
                for v in "${CITIES[@]}"; do
                  v=$(echo "$v" | sed 's/^ *//;s/ *$//')
                  for q in "${QUERIES[@]}"; do
                    body=$(jq -nc --arg a "$a" --arg q "$q $v" '{op:"import",audience:$a,query:$q}')
                    res=$(call "$body")
                    echo "$a | $q $v : $(echo "$res" | jq -c '{resultats_maps, sites_visites, emails_trouves, ajoutes, error}' 2>/dev/null || echo "$res" | head -c 200)"
                    n=$(echo "$res" | jq -r '.ajoutes // 0' 2>/dev/null || echo 0)
                    total=$((total + n))
                    # Plafond gratuit de Google atteint (ou compteur absent) : on arrête tout
                    if echo "$res" | grep -q 'Plafond gratuit\|Compteur Google'; then echo "::warning title=Google Maps::$(echo "$res" | jq -r '.error')"; break 3; fi
                  done
                done
              done
              echo "Total ajouté : $total contacts"
              echo "::notice title=Import Google Maps::$total contacts ajoutés · appels du mois : $(call '{"op":"status"}' | jq -c '[.google_ce_mois.items[]? | "\(.label) \(.used)/\(.cap)"]')"
              call '{"op":"status"}' | jq '{contacts, envoyes_total, google_ce_mois}' ;;
          esac

      - name: Contrôle des textes (nombre d'e-mails qui citent encore « 12 photos »)
        if: always() && (inputs.operation == 'corriger_textes' || github.event_name == 'push')
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          n=$(curl -s -o /dev/null -D - "$SUPABASE_URL/rest/v1/outreach_steps?select=id&body=ilike.*12%20photos*" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact" | tr -d '\r' | grep -i '^content-range' | sed 's/.*\///')
          j=$(curl -s -o /dev/null -D - "$SUPABASE_URL/rest/v1/outreach_steps?select=id&body=ilike.*jusqu*12%20photos*" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact" | tr -d '\r' | grep -i '^content-range' | sed 's/.*\///')
          c=$(curl -s -o /dev/null -D - "$SUPABASE_URL/rest/v1/outreach_steps?select=id&body=ilike.*mets%20en%20avant%20sur%20ton%20portfolio*" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact" | tr -d '\r' | grep -i '^content-range' | sed 's/.*\///')
          echo "::notice title=Contrôle::${n:-?} e-mail(s) citent « 12 photos », dont ${j:-?} promettent « jusqu'à 12 photos » ; ${c:-?} contiennent le conseil corrigé (photos sur ton portfolio)"

