# Mesure la vitesse réelle de l'app et du site (DNS, connexion TLS, temps de
# réponse du serveur), fonction « froide » puis « chaude ». Résultats en
# annotations du job (lisibles sans connexion). Aucune donnée privée : pages
# publiques et redirections seulement.
name: Mesure de vitesse

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/mesure-vitesse.yml']

jobs:
  mesure:
    runs-on: ubuntu-latest
    steps:
      - name: Mesurer
        run: |
          fmt='dns=%{time_namelookup}s tls=%{time_appconnect}s serveur=%{time_starttransfer}s total=%{time_total}s code=%{http_code}'
          mesure() {
            local label="$1" url="$2"
            local out hdr region
            hdr=$(mktemp)
            out=$(curl -s -o /dev/null -D "$hdr" -w "$fmt" "$url")
            region=$(grep -i '^x-vercel-id' "$hdr" | tr -d '\r' | cut -d' ' -f2 | cut -d: -f1-3)
            echo "::notice title=$label::$out vercel=$region"
          }
          # Page contrat AVANT réveil (fonction peut-être endormie)
          mesure "page contrat avant réveil" https://app.jasonmarinho.com/sign/mesure-vitesse-inexistant
          # Page de réveil appelée par le site (doit répondre 200)
          mesure "reveil" https://app.jasonmarinho.com/reveil
          # Fonction serveur d'abord (peut être « froide »), puis à chaud
          for i in 1 2 3 4 5; do
            mesure "fonction api $i" https://app.jasonmarinho.com/api/notifications/unread-counts
          done
          # Page publique rendue par le serveur avec une requête en base
          for i in 1 2 3; do
            mesure "page contrat (base) $i" https://app.jasonmarinho.com/sign/mesure-vitesse-inexistant
          done
          for i in 1 2; do
            mesure "login $i" https://app.jasonmarinho.com/auth/login
            mesure "dashboard sans session $i" https://app.jasonmarinho.com/dashboard
          done
          mesure "site accueil" https://jasonmarinho.com/
