name: Social publishing dispatch

# Le déclenchement "schedule" a été retiré : sur un cron toutes les 5 minutes,
# GitHub Actions retarde ou saute massivement les exécutions (observé : 2-5h
# d'écart réel entre exécutions au lieu de 5 min), inutilisable pour une
# planification de publication fiable.
#
# Remplacé par une Routine Claude Code (compte Jason) qui se déclenche toutes
# les heures et pousse un commit modifiant automation/social-dispatch-ping
# (horodatage) — le trigger "push" ci-dessous s'en sert comme déclencheur
# fiable, sans dépendre d'un cron GitHub natif ni d'un compte Upstash externe
# jamais configuré. Même pattern que la veille "Actualités LCD journalière"
# (voir data/actualites-queue/ + son propre workflow) : une session sans
# accès direct à l'API GitHub Actions ne peut pas déclencher un
# workflow_dispatch, mais peut toujours committer/pousser du code, qui lui,
# déclenche le workflow via ce trigger push scopé à un seul fichier.
on:
  workflow_dispatch: # déclenchement manuel pour tester
  push:
    branches: [main]
    paths:
      - 'automation/social-dispatch-ping'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Publier les posts programmés dus
        run: |
          RESPONSE=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X GET https://app.jasonmarinho.com/api/cron/social-dispatch \
            -H "Authorization: Bearer ${{ secrets.SOCIAL_CRON_SECRET }}")
          echo "Status HTTP : $RESPONSE"
          cat /tmp/dispatch_response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "ERREUR : dispatch social a échoué (HTTP $RESPONSE)"
            exit 1
          fi
