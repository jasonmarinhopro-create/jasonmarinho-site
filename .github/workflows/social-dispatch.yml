name: Social publishing dispatch

# Le déclenchement "schedule" a été retiré : sur un cron toutes les 5 minutes,
# GitHub Actions retarde ou saute massivement les exécutions (observé : 2-5h
# d'écart réel entre exécutions au lieu de 5 min), inutilisable pour une
# planification de publication fiable. Remplacé par Upstash QStash, qui
# appelle directement /api/cron/social-dispatch sur son propre cron (voir
# CLAUDE.md). Ce workflow reste disponible en déclenchement manuel pour
# tester ou forcer un passage.
on:
  workflow_dispatch: # déclenchement manuel pour tester

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Publier les posts programmés dus
        run: |
          RESPONSE=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X GET https://app.jasonmarinho.com/api/cron/social-dispatch \
            -H "Authorization: Bearer ${{ secrets.SOCIAL_CRON_SECRET }}")
          echo "Status HTTP : $RESPONSE"
          cat /tmp/dispatch_response.json
          if [ "$RESPONSE" != "200" ]; then
            echo "ERREUR : dispatch social a échoué (HTTP $RESPONSE)"
            exit 1
          fi
