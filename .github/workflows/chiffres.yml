# Chiffres d'usage (nombres seulement, jamais de nom ni d'e-mail : dépôt
# public). Sert à décider des invitations au Standard : qui utilise quoi.
# Lancement : à la main, ou push de .github/chiffres-trigger sur claude/**.
name: Chiffres d'usage

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/chiffres-trigger']

jobs:
  chiffres:
    runs-on: ubuntu-latest
    steps:
      - name: Compter
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          get() { curl -sf "$SUPABASE_URL/rest/v1/$1" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY"; }
          get "profiles?select=id,plan,role,driing_status" > profiles.json
          get "contracts?select=user_id,statut,stripe_payment_enabled,montant_caution,stripe_deposit_status" > contracts.json
          get "logements?select=user_id" > logements.json
          get "sejours?select=user_id" > sejours.json
          python3 - <<'PY'
          import json
          P = json.load(open('profiles.json')); C = json.load(open('contracts.json'))
          L = json.load(open('logements.json')); S = json.load(open('sejours.json'))
          plan = {p['id']: ('admin' if p.get('role') == 'admin' else (p.get('plan') or 'decouverte')) for p in P}
          from collections import Counter
          plans = Counter(plan.values())
          free = {u for u, pl in plan.items() if pl == 'decouverte'}
          has_log = {r['user_id'] for r in L}; has_sej = {r['user_id'] for r in S}
          free_contracts = [c for c in C if c['user_id'] in free]
          free_users_contracts = {c['user_id'] for c in free_contracts}
          free_signed = [c for c in free_contracts if c.get('statut') == 'signe']
          free_stripe = [c for c in free_contracts if c.get('stripe_payment_enabled')]
          free_caution = [c for c in free_contracts if (c.get('stripe_deposit_status') or '') in ('held', 'captured', 'released', 'expired', 'pending')]
          lines = [
            f"Comptes par formule : {dict(plans)}",
            f"Gratuits avec un logement : {len(free & has_log)} · avec un séjour : {len(free & has_sej)}",
            f"Gratuits qui ont créé au moins un contrat : {len(free_users_contracts)} ({len(free_contracts)} contrats, {len(free_signed)} signés, {len(free_stripe)} avec paiement en ligne, {len(free_caution)} avec caution Stripe)",
          ]
          ds = Counter((p.get('driing_status') or 'none') + ' / ' + ('admin' if p.get('role') == 'admin' else (p.get('plan') or 'decouverte')) for p in P)
          pend = {p['id'] for p in P if p.get('driing_status') == 'pending'}
          lines.append(f"Statut Driing / formule : {dict(ds)}")
          lines.append(f"Driing en attente : {len(pend)} · avec un logement : {len(pend & has_log)} · avec un contrat : {len(pend & {c['user_id'] for c in C})}")
          print('::notice title=Chiffres::' + '%0A'.join(lines))
          PY

      - name: Activité et trafic
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          # Nombres seulement : aucune adresse, aucun nom, aucun identifiant.
          import json, os, urllib.request, datetime as dt
          from collections import Counter
          U, K = os.environ['SUPABASE_URL'], os.environ['SERVICE_KEY']
          def get(path):
              req = urllib.request.Request(f"{U}{path}", headers={'apikey': K, 'Authorization': f'Bearer {K}'})
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          def rest_all(table, select, extra=''):
              out, off = [], 0
              while True:
                  rows = get(f"/rest/v1/{table}?select={select}{extra}&limit=1000&offset={off}")
                  out += rows
                  if len(rows) < 1000: return out
                  off += 1000
          now = dt.datetime.now(dt.timezone.utc)
          def age(ts):
              if not ts: return None
              return (now - dt.datetime.fromisoformat(ts.replace('Z', '+00:00'))).days
          P = rest_all('profiles', 'id,plan,role')
          plan = {p['id']: ('admin' if p.get('role') == 'admin' else (p.get('plan') or 'decouverte')) for p in P}
          users = get('/auth/v1/admin/users?per_page=1000').get('users', [])
          seen7 = Counter(); seen30 = Counter(); months = Counter()
          for u in users:
              pl = plan.get(u['id'], '?')
              a = age(u.get('last_sign_in_at'))
              if a is not None and a <= 7: seen7[pl] += 1
              if a is not None and a <= 30: seen30[pl] += 1
              months[(u.get('created_at') or '')[:7]] += 1
          L = rest_all('logements', 'user_id'); C = rest_all('contracts', 'user_id,statut')
          F = rest_all('ical_feeds', 'user_id'); S = rest_all('sejours', 'user_id')
          def by_plan(rows): return dict(Counter(plan.get(u, '?') for u in {r['user_id'] for r in rows}))
          ph = rest_all('photographers', 'stripe_subscription_status,status')
          cl = rest_all('cleaners', 'stripe_subscription_status,status')
          paid = lambda rows: sum(1 for r in rows if r.get('stripe_subscription_status') in ('active', 'trialing', 'past_due'))
          since = (now - dt.timedelta(days=30)).strftime('%Y-%m-%dT%H:%M:%S')
          V = rest_all('site_visits', 'session_id,path,referrer,utm_source,created_at', f'&created_at=gte.{since}&order=created_at.asc')
          first = {}
          for v in V: first.setdefault(v['session_id'], v)
          def chan(v):
              r = (v.get('referrer') or '').lower(); s = (v.get('utm_source') or '').lower()
              if s: return 'utm:' + s[:20]
              if 'google' in r: return 'google'
              if 'bing' in r or 'duckduckgo' in r or 'qwant' in r or 'ecosia' in r: return 'autre moteur'
              if 'facebook' in r or 'fb.' in r: return 'facebook'
              if 'chatgpt' in r or 'perplexity' in r or 'gemini' in r or 'claude' in r or 'copilot' in r: return 'ia'
              if not r or 'jasonmarinho.com' in r: return 'direct'
              return 'autre site'
          def kind(p):
              p = p or '/'
              for k in ('/blog', '/devenir-hote-airbnb', '/menage-lcd', '/photographe-lcd', '/annuaires', '/services', '/partenaires', '/tarifs', '/comparatif', '/calculateurs', '/l/'):
                  if p.startswith(k): return k
              return 'accueil' if p == '/' else 'autre'
          days = Counter(v['created_at'][:10] for v in first.values())
          lines = [
            f"Connectés 7 j : {dict(seen7)} · 30 j : {dict(seen30)}",
            f"Comptes créés par mois : {dict(sorted(months.items())[-6:])}",
            f"Avec un logement : {by_plan(L)} · flux iCal : {by_plan(F)} · séjour : {by_plan(S)} · contrat : {by_plan(C)}",
            f"Contrats : {len(C)} (signés {sum(1 for c in C if c.get('statut') == 'signe')})",
            f"Fiches photographes : {len(ph)} (payées {paid(ph)}) · ménage : {len(cl)} (payées {paid(cl)})",
            f"Site 30 j : {len(first)} visites, {len(V)} pages vues, {round(len(first)/30,1)} visites/jour, meilleur jour {max(days.values()) if days else 0}",
            f"Canaux (1re page) : {dict(Counter(chan(v) for v in first.values()).most_common(8))}",
            f"Pages d'entrée : {dict(Counter(kind(v['path']) for v in first.values()).most_common(12))}",
          ]
          SP = rest_all('profiles', 'stripe_subscription_status,stripe_price_id,stripe_subscription_id', '&plan=eq.standard')
          lines.append(f"Standard : statut Stripe {dict(Counter(str(r.get('stripe_subscription_status')) for r in SP))} · avec prix {sum(1 for r in SP if r.get('stripe_price_id'))} · avec abonnement {sum(1 for r in SP if r.get('stripe_subscription_id'))}")
          try:
              with urllib.request.urlopen('https://app.jasonmarinho.com/api/founder-seats', timeout=20) as r: lines.append('founder-seats : ' + r.read().decode()[:200])
          except Exception as e:
              lines.append(f'founder-seats : erreur {type(e).__name__}')
          print('::notice title=Activité::' + '%0A'.join(lines))
          PY

      - name: Google (Search Console, 28 jours)
        env:
          SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
        run: |
          r=$(curl -sS --max-time 70 "https://app.jasonmarinho.com/api/ops/seo-chiffres" -H "authorization: Bearer $SECRET" || true)
          printf '%s' "$r" | python3 -c '
          import json, sys
          try: d = json.load(sys.stdin)
          except Exception: print("::notice title=Google::réponse illisible"); sys.exit(0)
          if "error" in d: print("::notice title=Google::" + d["error"]); sys.exit(0)
          out = lambda t, lines: print(f"::notice title={t}::" + "%0A".join(l.replace("%", "%25") for l in lines)[:3900])
          sortes = sorted(d["par_sorte"].items(), key=lambda x: -x[1]["affichages"])
          out("Google par sorte de page", [d["periode"]] + ["{} : {pages} pages, {affichages} aff., {clics} clics (avant {clics_avant})".format(k, **v) for k, v in sortes])
          b = d["blog"]
          out("Google blog", ["articles vus : {articles_vus_dans_google}, avec au moins un clic : {avec_au_moins_un_clic}".format(**b)] + b["top"])
          out("A un pas de la 1re page", d["proches_premiere_page"])
          out("Recherches qui cliquent", d["qui_cliquent"])
          '
