name: Site statique

# Le forfait Vercel Hobby refuse tout déploiement du site statique qui
# contient plus de 12 fonctions serverless (fichiers .js sous api/). Le
# 27/09/2026, une 13e fonction a fait échouer tous les déploiements pendant
# plusieurs heures sans autre signal qu'un email Vercel : ce contrôle échoue
# dès le push, avec un message clair.

on:
  push:
    branches: [main, 'claude/**']
    paths: ['api/**', 'scripts/**', '*.js', '.github/workflows/static-site-check.yml', 'footer.js', 'sitemap.xml', 'scripts/data/villes-local.mjs', 'jason-app/lib/visibility/city-page.ts', '.github/workflows/prospection-reserve.yml', 'photographe-lcd-*/**', 'menage-lcd-*/**', 'depannage-lcd-*/**', 'devenir-hote-airbnb-*/**']
  pull_request:
    paths: ['api/**']

jobs:
  functions-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts lisibles par Node (erreur de syntaxe = arrêt avant un passage planifié)
        run: |
          fail=0
          for f in $(git ls-files 'scripts/*.mjs' 'scripts/**/*.mjs' 'scripts/*.cjs' 'scripts/**/*.cjs' 'api/*.js' 'api/**/*.js' '*.js'); do
            node --check "$f" 2>/tmp/err || { echo "::error file=$f::$(head -3 /tmp/err | tr '\n' ' ')"; fail=1; }
          done
          exit $fail
      - name: Au plus 12 fonctions serverless (limite Vercel Hobby)
        run: |
          COUNT=$(find api -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | wc -l)
          echo "Fonctions serverless : $COUNT / 12"
          find api -type f | sort
          if [ "$COUNT" -gt 12 ]; then
            echo "::error::$COUNT fonctions dans api/ : Vercel Hobby en accepte 12, le déploiement du site échouera. Fusionner des fonctions (ex. route dynamique api/xxx/[type].js) ou en supprimer une."
            exit 1
          fi

  villes:
    # Une ville = 4 pages (photographe, ménage, dépannage depuis le 31/10/2026,
    # devenir hôte), décision de
    # Jason du 17/10/2026 : échoue s'il manque une page, une adresse du
    # sitemap, le contenu vérifié ou la place dans l'app. Créer une ville :
    # node scripts/creer-ville.mjs <slug> "<commune>".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chaque ville a toutes ses pages
        run: node scripts/verifier-villes.mjs
