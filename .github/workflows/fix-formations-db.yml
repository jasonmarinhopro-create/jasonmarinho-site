name: Corriger le texte des formations en base

# Correctifs ciblés dans formation_lessons (chiffres fiscaux 2026, tirets
# cadratins) sans écraser les leçons réécrites dans l'éditeur admin.
# Manuel uniquement. Par défaut : aperçu (rien n'est écrit, extraits courts).
# Cocher « Écrire en base » pour appliquer. Idempotent.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Écrire en base (décoché = aperçu seulement)"
        type: boolean
        required: false
        default: false
      tva_review:
        description: "Lister les passages qui citent un seuil de TVA (relecture)"
        type: boolean
        required: false
        default: false

concurrency:
  group: formations-db
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jason-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jason-app/package-lock.json

      - run: npm ci

      - name: ${{ inputs.apply && 'Corriger en base' || 'Aperçu des corrections' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.apply && '0' || '1' }}
          TVA_REVIEW: ${{ inputs.tva_review && '1' || '0' }}
        run: node scripts/fix-formations-db.mjs
