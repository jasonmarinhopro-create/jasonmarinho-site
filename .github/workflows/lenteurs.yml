# Lit les mesures de lenteur enregistrées par l'app (app_errors, route
# « perf ») : ouvertures et changements de page de plus de 3 s sur le
# téléphone, rendus serveur de plus de 1,5 s, avec le détail des étapes.
# Résultats en annotations du job (lisibles sans connexion). Aucune donnée
# personnelle : dates, chemins (identifiants retirés) et durées seulement.
name: Lenteurs

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/lenteurs-trigger']

jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - name: Lire les mesures
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          rows=$(curl -sf "$SUPABASE_URL/rest/v1/app_errors?route=eq.perf&select=created_at,source,message&order=created_at.desc&limit=80" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")
          total=$(echo "$rows" | jq 'length')
          echo "::notice title=Mesures::$total mesure(s) de lenteur (80 plus récentes au maximum)"
          # Heure de Paris, une ligne par mesure, 10 lignes par annotation
          echo "$rows" | jq -r '.[] | "\(.created_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601 + 7200 | strftime("%d/%m %H:%M")) \(.source) \(.message)"' > lignes.txt
          [ -s lignes.txt ] || exit 0
          split -l 10 lignes.txt part_
          n=0
          for f in part_*; do
            n=$((n+1))
            body=$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")
            echo "::notice title=Lenteurs $n::$body"
          done
          cat lignes.txt

      - name: Tester la base
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Temps de réponse de la base depuis GitHub (hors Europe : ~80 ms
          # d'aller-retour en plus) et nombre de lignes des grosses tables.
          # Aucune donnée lue, seulement des comptes.
          lignes=""
          for t in profiles contracts sejours logements ical_events ical_feeds notifications chez_nous_notifications site_visits affiliate_clicks app_errors calendar_events revenus_entries outreach_sends; do
            out=$(curl -s -o /dev/null -D - -w "TIME:%{time_total}" -I "$SUPABASE_URL/rest/v1/$t?select=*" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact")
            n=$(echo "$out" | tr -d '\r' | grep -i '^content-range' | sed 's/.*\///')
            ms=$(echo "$out" | grep -o 'TIME:[0-9.]*' | cut -d: -f2 | awk '{printf "%d", $1*1000}')
            lignes="$lignes$t : ${n:-?} lignes, compté en ${ms} ms%0A"
          done
          echo "::notice title=Base de données::$lignes"
          # Même requête simple 5 fois : latence de base
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -w "%{time_total}\n" "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY"
          done | awk '{s=s sprintf("%d ms ", $1*1000)} END {print "::notice title=Requête simple x5::" s}'
          # Rafale : 30 requêtes simultanées (comme l'ouverture de l'app).
          # Si Supabase les met en file, le total explose.
          start=$(date +%s%3N)
          seq 1 30 | xargs -P 30 -I{} curl -s -o /dev/null -w "%{time_total}\n" "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" > rafale.txt
          end=$(date +%s%3N)
          sort -n rafale.txt | awk -v tot=$((end-start)) '{a[NR]=$1} END {printf "::notice title=Rafale de 30 requêtes::total %d ms, la plus rapide %d ms, médiane %d ms, la plus lente %d ms\n", tot, a[1]*1000, a[int(NR/2)]*1000, a[NR]*1000}'
