# Photos libres des villes depuis Wikimedia Commons (10/11/2026). Push de
# .github/photos-trigger sur claude/** : 1re ligne « chercher <liste> » ou
# « prendre <liste> ». Résultat enregistré dans .github/photos-commons/.
name: Photos Commons

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/photos-trigger']

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ImageMagick
        run: command -v montage || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
      - name: Photos
        run: node scripts/photos-commons.mjs $(head -1 .github/photos-trigger | cut -d' ' -f1) "$(head -1 .github/photos-trigger | cut -d' ' -f2-)"
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/photos-commons
          git commit -m "photos: candidates Wikimedia Commons" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
