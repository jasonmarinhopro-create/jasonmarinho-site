# Prospection : réserve de contacts et relecture de la boîte (06/10/2026,
# Jason : « ajouter des équipes de ménage et des photographes pour en avoir
# toujours sous la main »).
#   1. Relit la boîte sur 14 jours (réponses reconnues par adresse, fil de
#      discussion ou domaine pro) : une réponse manquée passe en « Ont répondu ».
#   2. Pour chaque audience (photographes, ménage, dépannage) dont il reste moins de
#      SEUIL contacts « À contacter », importe depuis OpenStreetMap les pros
#      de 10 villes de nos pages, en tournant sur toutes les villes de la liste.
# Chaque lundi, à la main, ou par un push de .github/prospection-trigger
# (ligne 1 : « remplir » pour 20 villes d'un coup). Journaux publics : la
# route ne renvoie que des nombres.
name: 'Prospection : réserve'

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
    inputs:
      villes_par_passage:
        description: 'Nombre de villes à importer par audience'
        default: '10'
  push:
    branches: ['claude/**']
    paths: ['.github/prospection-trigger']

concurrency:
  group: prospection
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APP_URL: https://app.jasonmarinho.com
      SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
      SEUIL: '40'
    steps:
      - uses: actions/checkout@v4
      - name: Relire la boîte (14 jours)
        id: boite
        run: |
          r=$(curl -sS --max-time 75 -X POST "$APP_URL/api/outreach/ops" -H "authorization: Bearer $SECRET" -H 'content-type: application/json' -d '{"op":"boite","jours":14}')
          echo "$r" | jq . || echo "$r"
          echo "::notice title=Boîte relue::$(echo "$r" | jq -c . 2>/dev/null || echo "$r" | head -c 300)"
          echo "lus=$(echo "$r" | jq -r '.messages_lus // "?"' 2>/dev/null || echo '?')" >> "$GITHUB_OUTPUT"
      - name: Garder une réserve de contacts
        env:
          PAR_PASSAGE: ${{ inputs.villes_par_passage }}
        run: |
          set -u
          call() { curl -sS --max-time 75 -X POST "$APP_URL/api/outreach/ops" -H "authorization: Bearer $SECRET" -H 'content-type: application/json' -d "$1"; echo; }
          # Les 62 villes de nos pages photographe-lcd-* / menage-lcd-*
          CITIES=("Paris" "Lyon" "Marseille" "Bordeaux" "Nice" "Toulouse" "Montpellier" "Nantes" "Lille" "Strasbourg" \
            "Rennes" "Annecy" "La Rochelle" "Biarritz" "Saint-Malo" "Aix-en-Provence" "Cannes" "Arcachon" "Avignon" "Chamonix" \
            "Grenoble" "Dijon" "Reims" "Tours" "Angers" "Rouen" "Caen" "Brest" "Metz" "Nancy" \
            "Clermont-Ferrand" "Le Mans" "Perpignan" "Nîmes" "Pau" "Bayonne" "Poitiers" "Quimper" "Vannes" "Troyes" \
            "Colmar" "Chambéry" "Antibes" "Menton" "Ajaccio" "Bastia" "Sète" "Carcassonne" "Sarlat-la-Canéda" "Beaune" \
            "Deauville" "Honfleur" "Étretat" "Dinard" "La Baule-Escoublac" "Le Touquet-Paris-Plage" "Épernay" "Megève" "Saint-Tropez" "Versailles" \
            "Les Sables-d'Olonne" \
            "Roanne")
          n="${PAR_PASSAGE:-10}"
          if [ "${{ github.event_name }}" = push ] && grep -qi '^remplir' .github/prospection-trigger 2>/dev/null; then n=20; fi
          week=$((10#$(date -u +%V)))
          start=$(( (week * n) % ${#CITIES[@]} ))
          # Sélections OpenStreetMap par audience (mêmes règles que l'app)
          sel() {
            case "$1" in
              depannage) echo 'nwr["craft"~"^(plumber|electrician|locksmith|hvac|handyman|heating_engineer)$"]["website"](area.a);nwr["craft"~"^(plumber|electrician|locksmith|hvac|handyman|heating_engineer)$"]["contact:website"](area.a);nwr["shop"="locksmith"]["website"](area.a);nwr["name"~"d[ée]pann|multi.?services?|plomb|[ée]lectric|serrur|chauffag|petits travaux",i]["website"][!"shop"][!"amenity"](area.a);' ;;
              photographe) echo 'nwr["craft"="photographer"](area.a);nwr["shop"="photo"](area.a);nwr["name"~"photograph",i]["website"](area.a);nwr["name"~"vid[eé]aste|vid[eé]o|drone",i]["website"][!"amenity"](area.a);' ;;
              menage) echo 'nwr["craft"="cleaning"](area.a);nwr["office"]["name"~"ménage|menage|nettoyage|conciergerie|cleaning|propreté",i](area.a);nwr["name"~"ménage|menage|nettoyage|conciergerie|cleaning|airbnb|gestion locative",i]["website"](area.a);' ;;
            esac
          }
          status=$(call '{"op":"status"}')
          total=0
          for a in photographe menage depannage; do
            have=$(echo "$status" | jq -r --arg a "$a" '.contacts[$a].a_contacter // 0')
            echo "$a : $have contacts « À contacter » (seuil $SEUIL)"
            if [ "$have" -ge "$SEUIL" ] && { [ "${{ github.event_name }}" != push ] || [ "$have" -ge 400 ]; }; then echo "  réserve suffisante"; continue; fi
            added_a=0
            for i in $(seq 0 $((n - 1))); do
              v="${CITIES[$(( (start + i) % ${#CITIES[@]} ))]}"
              # 10/11/2026 : OpenStreetMap ne répondait plus à temps depuis le
              # serveur de l'app (0 dépanneur importé en 10 jours). Interrogé
              # ici, avec 60 s de marge ; l'app ne fait que chercher l'e-mail
              # sur le site de chaque pro (op import_candidats).
              ql="[out:json][timeout:60];area[\"name\"=\"$v\"][\"boundary\"=\"administrative\"][\"admin_level\"=\"8\"]->.a;($(sel "$a"));out tags 400;"
              osm=""
              for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
                osm=$(curl -sS --max-time 90 -A 'JasonMarinhoBot/1.0 (+https://jasonmarinho.com)' --data-urlencode "data=$ql" "$ep" 2>/dev/null || true)
                echo "$osm" | jq -e '.elements' >/dev/null 2>&1 && break
                osm=""
                sleep 5
              done
              if [ -z "$osm" ]; then echo "  $v : OpenStreetMap indisponible"; continue; fi
              cands=$(echo "$osm" | jq -c '[.elements[] | .tags // {} | {nom: .name, site: (.website // ."contact:website" // .url), tel: (.phone // ."contact:phone"), cp: ."addr:postcode", ville: ."addr:city"} | select(.nom != null and .site != null)] | unique_by(.site)')
              nb=$(echo "$cands" | jq 'length')
              for pass in 1 2 3 4 5 6; do
                [ "$nb" -gt 0 ] || break
                body=$(jq -nc --arg a "$a" --arg v "$v" --argjson c "$cands" '{op:"import_candidats",audience:$a,ville:$v,candidats:$c}')
                res=$(call "$body")
                k=$(echo "$res" | jq -r '.ajoutes // 0' 2>/dev/null || echo 0)
                echo "  $v ($pass) : $nb avec site · $(echo "$res" | jq -c '{sites_visites, emails_trouves, ajoutes, reste_a_visiter, error}' 2>/dev/null || echo "$res" | head -c 160)"
                added_a=$((added_a + k))
                left=$(echo "$res" | jq -r '.reste_a_visiter // 0' 2>/dev/null || echo 0)
                [ "$left" -gt 0 ] || break
              done
              sleep 6
            done
            total=$((total + added_a))
            echo "::notice title=Réserve $a::$have à contacter avant, $added_a ajoutés ($n villes à partir de ${CITIES[$start]})"
          done
          after=$(call '{"op":"status"}' | jq -c '{photographe: .contacts.photographe.a_contacter, menage: .contacts.menage.a_contacter, depannage: .contacts.depannage.a_contacter}')
          echo "::notice title=Réserve après import::$total ajoutés · à contacter : $after"
      # 10/11/2026 : pendant un mois, la boîte lue par l'app était vide (les
      # messages relevés par Gmail étaient retirés du serveur) : 6 réponses de
      # photographes jamais vues, leurs relances ont continué. Une boîte sans
      # aucun message en 14 jours fait échouer la tâche pour que ça se voie.
      - name: La boîte contient-elle des messages ?
        if: always()
        run: |
          if [ "${{ steps.boite.outputs.lus }}" = "0" ]; then
            echo "::error title=Boîte vide::Aucun message lu en 14 jours : les réponses des pros ne sont pas vues. Vérifier que la boîte garde une copie des messages sur le serveur (relève Gmail ou transfert)."
            exit 1
          fi
